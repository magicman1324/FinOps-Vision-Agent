<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 视觉对话助手</title>
<style>
:root {
  --bg: #1a1a2e;
  --surface: #16213e;
  --text: #e0e0e0;
  --text-muted: #888;
  --accent: #4fc3f7;
  --accent-bg: rgba(79, 195, 247, 0.12);
  --error: #ef5350;
  --error-bg: rgba(239, 83, 80, 0.12);
  --success: #66bb6a;
  --success-bg: rgba(102, 187, 106, 0.12);
  --warn: #ffa726;
  --bubble-radius: 14px;
}
body {
  margin: 0; padding: 20px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh;
}
#app {
  max-width: 800px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 12px;
  height: calc(100vh - 40px);
}

/* 摄像头 */
#video-container {
  position: relative;
  border-radius: 12px; overflow: hidden;
  background: #000;
  flex-shrink: 0;
}
#camera { width: 100%; display: block; }

/* 状态栏 */
#status-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 14px;
  background: var(--surface);
  border-radius: 8px;
  font-size: 13px;
  flex-shrink: 0;
}
#status-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--success);
  transition: background 0.3s;
}
#status-dot.listening { background: var(--warn); animation: pulse 0.8s infinite; }
#status-dot.processing { background: var(--warn); animation: pulse 0.6s infinite; }
#status-dot.error { background: var(--error); }
#status-dot.idle { background: var(--success); }
@keyframes pulse {
  0%, 100% { opacity: 1; } 50% { opacity: 0.3; }
}

/* 对话气泡区 */
#chat {
  flex: 1;
  overflow-y: auto;
  display: flex; flex-direction: column; gap: 8px;
  padding: 4px 0;
}
.chat-msg {
  display: flex; flex-direction: column;
  max-width: 80%;
  padding: 8px 14px;
  border-radius: var(--bubble-radius);
  font-size: 14px; line-height: 1.55;
  animation: fadeIn 0.25s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.chat-msg .time {
  font-size: 10px; opacity: 0.5;
  margin-bottom: 2px;
}

/* 用户 (右侧, 青色) */
.chat-msg.user {
  align-self: flex-end;
  background: var(--accent-bg);
  border-bottom-right-radius: 4px;
  text-align: right;
  color: var(--accent);
}

/* AI (左侧, 绿色) */
.chat-msg.assistant {
  align-self: flex-start;
  background: var(--success-bg);
  border-bottom-left-radius: 4px;
  color: var(--text);
}

/* 系统 (居中, 灰色) */
.chat-msg.system {
  align-self: center;
  background: transparent;
  color: var(--text-muted);
  font-size: 12px;
  padding: 2px 8px;
  max-width: 100%;
  text-align: center;
}

/* 错误 (全宽, 红色) */
.chat-msg.error {
  align-self: stretch;
  background: var(--error-bg);
  border-left: 3px solid var(--error);
  border-radius: 4px;
  color: var(--error);
  max-width: 100%;
}

audio { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="video-container">
    <video id="camera" autoplay playsinline muted></video>
  </div>
  <div id="status-bar">
    <div id="status-dot" class="idle"></div>
    <span id="status-text">初始化中...</span>
  </div>
  <div id="chat"></div>
  <audio id="audio-player"></audio>
</div>

<script src="vad.js"></script>
<script src="camera.js"></script>
<script src="websocket.js"></script>
<script>
const camera = document.getElementById('camera');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const audioPlayer = document.getElementById('audio-player');
const chatEl = document.getElementById('chat');

function setStatus(state, text) {
  statusDot.className = state;
  statusText.textContent = text;
}

function addBubble(text, cls) {
  const div = document.createElement('div');
  div.className = 'chat-msg ' + cls;

  const time = document.createElement('div');
  time.className = 'time';
  time.textContent = new Date().toLocaleTimeString();

  div.appendChild(time);
  div.appendChild(document.createTextNode(text));
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

let ttsBuffer = [];

onAsrResult(function(text) {
  addBubble(text, 'user');
  setStatus('processing', '思考中...');
});

onVlmResult(function(text) {
  addBubble(text, 'system');
});

onTtsChunk(function(audioB64, isFinal) {
  if (audioB64) ttsBuffer.push(audioB64);
  if (isFinal) {
    const fullB64 = ttsBuffer.join('');
    ttsBuffer = [];
    if (fullB64) {
      const binary = atob(fullB64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      const blob = new Blob([bytes], { type: 'audio/mp3' });
      audioPlayer.src = URL.createObjectURL(blob);
      audioPlayer.play().catch(console.warn);
      // 播放时状态反馈
      audioPlayer.onplay = () => setStatus('', '播放中...');
      audioPlayer.onended = () => setStatus('idle', '就绪 — 请说话');
    } else {
      setStatus('idle', '就绪 — 请说话');
    }
  }
});

onError(function(msg) {
  addBubble(msg, 'error');
  setStatus('error', '服务端错误');
  setTimeout(() => setStatus('idle', '就绪 — 请说话'), 2500);
});

onStatus(function(state) {
  if (state === 'connected') {
    if (statusText.textContent === '初始化中...') setStatus('idle', '就绪 — 请说话');
  }
  if (state === 'reconnecting') {
    setStatus('error', '连接断开, 重连中...');
  }
  if (state === 'disconnected') {
    setStatus('error', '连接断开, 重连中...');
  }
  if (state === 'error') {
    setStatus('error', '连接失败 — 请刷新页面');
  }
});

connect();

async function initCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 640, height: 480 },
      audio: true
    });
    camera.srcObject = stream;
    addBubble('摄像头/麦克风就绪', 'system');
    startVAD(stream);
    onSpeechEnd(function(audio) {
      setStatus('processing', '处理中...');
      const dur = (audio.length / VAD_SAMPLE_RATE).toFixed(1);
      addBubble('语音 ' + dur + 's', 'user');
      if (!sendAudio(audio)) {
        addBubble('WebSocket 未连接, 语音未发送', 'error');
        setStatus('idle', '就绪 — 请说话');
      }
      const frame = captureFrame(camera);
      if (frame) {
        sendImage(frame);
      }
    });
    setStatus('idle', '就绪 — 请说话');
    return stream;
  } catch (err) {
    addBubble('权限获取失败: ' + err.message, 'error');
    setStatus('error', '摄像头/麦克风权限被拒绝');
    throw err;
  }
}

initCamera().catch(console.error);
</script>
</body>
</html>
