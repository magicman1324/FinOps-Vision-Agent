<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 视觉对话助手</title>
<style>
:root {
  --bg: #1a1a2e;
  --surface: #16213e;
  --text: #e0e0e0;
  --text-muted: #888;
  --accent: #4fc3f7;
  --accent-bg: rgba(79, 195, 247, 0.12);
  --error: #ef5350;
  --error-bg: rgba(239, 83, 80, 0.12);
  --success: #66bb6a;
  --success-bg: rgba(102, 187, 106, 0.12);
  --warn: #ffa726;
  --bubble-radius: 14px;
  --sidebar-w: 380px;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 16px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh;
}
#app {
  max-width: 1200px; margin: 0 auto;
  display: flex; gap: 16px;
  height: calc(100vh - 32px);
}

/* ---- 左侧栏: 摄像头 + 状态 ---- */
#sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  display: flex; flex-direction: column; gap: 10px;
}
#video-container {
  position: relative;
  border-radius: 12px; overflow: hidden;
  background: #000;
  aspect-ratio: 4/3;
}
#camera { width: 100%; height: 100%; object-fit: cover; display: block; }

/* 状态栏 */
#status-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 14px;
  background: var(--surface);
  border-radius: 8px;
  font-size: 13px;
  flex-shrink: 0;
}
#status-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--success);
  transition: background 0.3s;
  flex-shrink: 0;
}
#status-dot.listening { background: var(--warn); animation: pulse 0.8s infinite; }
#status-dot.processing { background: var(--warn); animation: pulse 0.6s infinite; }
#status-dot.error { background: var(--error); }
#status-dot.idle { background: var(--success); }

/* 音量指示器 */
#vol-meter {
  width: 60px; height: 10px;
  background: #333;
  border-radius: 5px;
  overflow: hidden;
  flex-shrink: 0;
}
#vol-fill {
  height: 100%; width: 0%;
  background: var(--error);
  border-radius: 5px;
  transition: width 0.15s, background 0.3s;
}
#vol-label {
  font-size: 10px;
  color: var(--text-muted);
  min-width: 32px;
  text-align: right;
  flex-shrink: 0;
}

@keyframes pulse {
  0%, 100% { opacity: 1; } 50% { opacity: 0.3; }
}

/* ---- 右侧: 对话区 ---- */
#chat-panel {
  flex: 1;
  display: flex; flex-direction: column;
  min-width: 0;
  background: var(--surface);
  border-radius: 12px;
  overflow: hidden;
}
#chat {
  flex: 1;
  overflow-y: auto;
  display: flex; flex-direction: column; gap: 10px;
  padding: 16px 20px;
}
.chat-msg {
  display: flex; flex-direction: column;
  max-width: 75%;
  padding: 10px 16px;
  border-radius: var(--bubble-radius);
  font-size: 15px; line-height: 1.6;
  animation: fadeIn 0.25s ease;
  word-break: break-word;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.chat-msg .time {
  font-size: 10px; opacity: 0.45;
  margin-bottom: 3px;
}

/* 用户 (右侧, 青色) */
.chat-msg.user {
  align-self: flex-end;
  background: var(--accent-bg);
  border-bottom-right-radius: 4px;
  text-align: right;
  color: var(--accent);
}

/* AI (左侧, 绿色) */
.chat-msg.assistant {
  align-self: flex-start;
  background: var(--success-bg);
  border-bottom-left-radius: 4px;
  color: var(--text);
}

/* 系统 (居中, 灰色) */
.chat-msg.system {
  align-self: center;
  background: transparent;
  color: var(--text-muted);
  font-size: 12px;
  padding: 2px 8px;
  max-width: 100%;
  text-align: center;
}

/* 错误 (全宽, 红色) */
.chat-msg.error {
  align-self: stretch;
  background: var(--error-bg);
  border-left: 3px solid var(--error);
  border-radius: 4px;
  color: var(--error);
  max-width: 100%;
}

audio { display: none; }

/* 录音按钮 */
#ptt-btn {
  width: 100%; height: 52px;
  border: 2px solid var(--accent);
  border-radius: 26px;
  background: var(--accent-bg);
  color: var(--accent);
  font-size: 16px; font-weight: 600;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
#ptt-btn:hover { background: rgba(79, 195, 247, 0.22); }
#ptt-btn:active { background: rgba(79, 195, 247, 0.30); }
#ptt-btn.recording {
  background: var(--error-bg);
  border-color: var(--error);
  color: var(--error);
  animation: pulse 0.8s infinite;
}
#ptt-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: currentColor;
  flex-shrink: 0;
}

/* 移动端: 堆叠布局 */
@media (max-width: 840px) {
  #app {
    flex-direction: column;
    gap: 10px;
  }
  #sidebar {
    width: 100%; flex-shrink: 0;
  }
  #video-container {
    max-height: 240px;
  }
  #chat-panel {
    flex: 1; min-height: 300px;
  }
  .chat-msg {
    max-width: 88%;
    font-size: 14px;
  }
}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="video-container">
      <video id="camera" autoplay playsinline muted></video>
    </div>
    <button id="ptt-btn"><span id="ptt-dot"></span>按住说话</button>
    <div id="status-bar">
      <div id="status-dot" class="idle"></div>
      <span id="status-text">初始化中...</span>
      <div id="vol-meter"><div id="vol-fill"></div></div>
      <span id="vol-label"></span>
    </div>
  </div>
  <div id="chat-panel">
    <div id="chat"></div>
  </div>
  <audio id="audio-player"></audio>
</div>

<script src="vad.js?v=14"></script>
<script src="camera.js?v=2"></script>
<script src="websocket.js?v=9"></script>
<script>
const camera = document.getElementById('camera');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const audioPlayer = document.getElementById('audio-player');
const chatEl = document.getElementById('chat');

const pttBtn = document.getElementById('ptt-btn');
const pttDot = document.getElementById('ptt-dot');
const volFill = document.getElementById('vol-fill');
const volLabel = document.getElementById('vol-label');

function setStatus(state, text) {
  statusDot.className = state;
  statusText.textContent = text;
}

onVolume(function(rms) {
  const pct = Math.min(100, Math.round(Math.pow(rms * 3, 0.6) * 100));
  volFill.style.width = pct + '%';
  if (rms < 0.005) {
    volFill.style.background = 'var(--error)';
  } else if (rms < 0.02) {
    volFill.style.background = 'var(--warn)';
  } else {
    volFill.style.background = 'var(--success)';
  }
  volLabel.textContent = (rms * 100).toFixed(1);
});

// 录音状态回显
onRecordState(function(active) {
  if (active) {
    pttBtn.className = 'recording';
    pttBtn.innerHTML = '<span id="ptt-dot"></span>松开发送';
    // 重新获取 ptt-dot 引用 (innerHTML 替换后失效)
    setStatus('listening', '录音中...');
  } else {
    pttBtn.className = '';
    pttBtn.innerHTML = '<span id="ptt-dot"></span>按住说话';
    setStatus('processing', '处理中...');
  }
});

function addBubble(text, cls) {
  const div = document.createElement('div');
  div.className = 'chat-msg ' + cls;

  const time = document.createElement('div');
  time.className = 'time';
  time.textContent = new Date().toLocaleTimeString();

  div.appendChild(time);
  div.appendChild(document.createTextNode(text));
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

let ttsBuffer = [];
let _msgSeq = 0;
let _playQueue = [];
let _isPlaying = false;

function _playNext() {
  if (_playQueue.length === 0) {
    _isPlaying = false;
    setStatus('idle', '就绪');
    return;
  }
  _isPlaying = true;
  const blob = _playQueue.shift();
  audioPlayer.src = URL.createObjectURL(blob);
  audioPlayer.play().catch(console.warn);
  audioPlayer.onplay = () => setStatus('', '播放中...');
  audioPlayer.onended = () => _playNext();
}

onAsrResult(function(text) {
  addBubble(text, 'user');
  setStatus('processing', '思考中...');
});

onTextResult(function(text) {
  addBubble(text, 'assistant');
  setStatus('idle', '');
});

onVlmResult(function(text) {
  addBubble(text, 'system');
});

onTtsChunk(function(audioB64, isFinal) {
  if (audioB64) ttsBuffer.push(audioB64);
  if (isFinal) {
    const fullB64 = ttsBuffer.join('');
    ttsBuffer = [];
    if (fullB64) {
      const binary = atob(fullB64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      const blob = new Blob([bytes], { type: 'audio/mp3' });
      _playQueue.push(blob);
      if (!_isPlaying) _playNext();
    }
  }
});

onError(function(msg) {
  addBubble(msg, 'error');
  setStatus('error', '服务端错误');
  setTimeout(() => setStatus('idle', '就绪'), 2500);
});

onStatus(function(state) {
  if (state === 'connected') {
    if (statusText.textContent === '初始化中...') setStatus('idle', '就绪');
  }
  if (state === 'reconnecting') {
    setStatus('error', '连接断开, 重连中...');
  }
  if (state === 'disconnected') {
    setStatus('error', '连接断开, 重连中...');
  }
  if (state === 'error') {
    setStatus('error', '连接失败 — 请刷新页面');
  }
});

connect();

// ---- 按键通话 ----
pttBtn.addEventListener('mousedown', function(e) {
  e.preventDefault();
  startRecording();
});
pttBtn.addEventListener('mouseup', function(e) {
  e.preventDefault();
  sendRecording();
});
pttBtn.addEventListener('mouseleave', function(e) {
  if (pttBtn.classList.contains('recording')) {
    sendRecording();
  }
});
// 触摸事件
pttBtn.addEventListener('touchstart', function(e) {
  e.preventDefault();
  startRecording();
});
pttBtn.addEventListener('touchend', function(e) {
  e.preventDefault();
  sendRecording();
});

function sendRecording() {
  stopRecording();
  // onSpeechEnd 回调会在 stopRecording 内触发，需要等待
}

async function initCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 640, height: 480 },
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
      }
    });
    camera.srcObject = stream;
    addBubble('摄像头/麦克风就绪 — 按住按钮说话，松开发送', 'system');
    startVAD(stream);  // 仅启动音频采集，不做 VAD 检测
    onSpeechEnd(function(audio) {
      // stopRecording() 触发此回调
      const dur = (audio.length / VAD_SAMPLE_RATE).toFixed(1);
      const seq = ++_msgSeq;
      console.log('[PTT] send seq=%d dur=%ss', seq, dur);
      if (!sendAudio(audio)) {
        addBubble('WebSocket 未连接, 语音未发送', 'error');
        setStatus('idle', '就绪');
        return;
      }
      setStatus('processing', '识别中...');
      const frame = captureFrame(camera);
      if (frame) {
        sendImage(frame);
      }
    });
    setStatus('idle', '就绪');
    return stream;
  } catch (err) {
    addBubble('权限获取失败: ' + err.message, 'error');
    setStatus('error', '摄像头/麦克风权限被拒绝');
    throw err;
  }
}

initCamera().catch(console.error);
</script>
</body>
</html>
